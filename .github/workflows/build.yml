
name: Build NOVA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --project-name nova_ai --platforms android nova_ai

      - name: Add Android voice permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("nova_ai/android/app/src/main/AndroidManifest.xml")
          text = p.read_text()

          permissions = '''
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
          '''

          text = text.replace(
              '<application',
              permissions + '\\n    <application',
              1
          )

          p.write_text(text)
          PY

      - name: Copy NOVA AI source
        run: |
          cp pubspec.yaml nova_ai/pubspec.yaml
          cp lib/main.dart nova_ai/lib/main.dart

      - name: Get dependencies
        run: |
          cd nova_ai
          flutter pub get

      - name: Build APK
        run: |
          cd nova_ai
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-2.0
          path: nova_ai/build/app/outputs/flutter-apk/app-release.apk
          
