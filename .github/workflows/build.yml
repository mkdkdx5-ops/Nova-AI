
name: Build NOVA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --project-name nova_ai --platforms android nova_ai

      - name: Copy NOVA source
        run: |
          cp pubspec.yaml nova_ai/pubspec.yaml
          cp lib/main.dart nova_ai/lib/main.dart

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("nova_ai/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = """
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
          """

          queries = """
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>
          """

          s = s.replace("<application", permissions + "\n    <application", 1)
          s = s.replace("<application", queries + "\n    <application", 1)

          p.write_text(s)
          PY

      - name: Install packages
        run: |
          cd nova_ai
          flutter pub get

      - name: Build release APK
        run: |
          cd nova_ai
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-AI-2
          path: nova_ai/build/app/outputs/flutter-apk/app-release.apk
          
